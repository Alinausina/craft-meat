<div class="modal-overlay" id="bookingModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Бронирование стола</h2>
            <button class="modal-close" onclick="closeBookingModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="bookingForm" class="booking-form">
            <div class="form-group">
                <label for="name">Имя *</label>
                <input type="text" id="name" required placeholder="Ваше имя">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" required placeholder="+7 (___) ___-__-__">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="date">Дата *</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="time">Время *</label>
                    <input type="time" id="time" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="guests">Количество гостей *</label>
                <select id="guests" required>
                    <option value="1">1 гость</option>
                    <option value="2" selected>2 гостя</option>
                    <option value="3">3 гостя</option>
                    <option value="4">4 гостя</option>
                    <option value="5">5 гостей</option>
                    <option value="6">6 гостей</option>
                    <option value="7">7 гостей</option>
                    <option value="8">8 гостей</option>
                    <option value="9">9 гостей</option>
                    <option value="10">10 гостей</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="comment">Комментарий</label>
                <textarea id="comment" rows="3" placeholder="Особые пожелания..."></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Забронировать</button>
                <button type="button" class="btn-secondary" onclick="closeBookingModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<style>
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background-color: white;
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px;
    border-bottom: 1px solid #e5e7eb;
}

.modal-header h2 {
    font-size: 24px;
    font-weight: bold;
    color: #1f2937;
    margin: 0;
}

.modal-close {
    background: none;
    border: none;
    color: #6b7280;
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
}

.modal-close:hover {
    color: #374151;
    background-color: #f3f4f6;
}

.booking-form {
    padding: 24px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: #374151;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #f97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 80px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 32px;
}

.form-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
}

.btn-primary {
    background-color: #f97316;
    color: white;
}

.btn-primary:hover {
    background-color: #ea580c;
}

.btn-secondary {
    background-color: white;
    color: #374151;
    border: 1px solid #d1d5db !important;
}

.btn-secondary:hover {
    background-color: #f9fafb;
}

/* Responsive */
@media (max-width: 767px) {
    .form-row {
        grid-template-columns: 1fr;
        gap: 20px;
    }
    
    .modal-header {
        padding: 20px;
    }
    
    .booking-form {
        padding: 20px;
    }
}

@media (max-width: 575px) {
    .modal-header h2 {
        font-size: 20px;
    }
    
    .form-actions {
        flex-direction: column;
    }
}

@media (max-width: 400px) {
    .modal-content {
        padding: 0;
    }
    
    .modal-header {
        padding: 16px;
    }
    
    .booking-form {
        padding: 16px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
        font-size: 14px;
        padding: 8px 10px;
    }
}
</style>

<script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Бронирование отправлено! Мы свяжемся с вами в ближайшее время.');
        closeBookingModal();
        this.reset();
    });
    
    function closeBookingModal() {
        document.getElementById('bookingModal').style.display = 'none';
    }
</script>
